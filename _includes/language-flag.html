{% assign flag_code = include.flag | default: 'fr' %}
{% assign flag_class = include.class | default: 'h-4 w-6' %}
{% if flag_code == 'fr' %}
<svg class="{{ flag_class }}" viewBox="0 0 3 2" role="img" aria-hidden="true" focusable="false">
  <rect width="1" height="2" fill="#0055A4" />
  <rect x="1" width="1" height="2" fill="#FFFFFF" />
  <rect x="2" width="1" height="2" fill="#EF4135" />
</svg>
{% elsif flag_code == 'nl' %}
<svg class="{{ flag_class }}" viewBox="0 0 3 2" role="img" aria-hidden="true" focusable="false">
  <rect width="3" height="0.67" fill="#AE1C28" />
  <rect y="0.67" width="3" height="0.67" fill="#FFFFFF" />
  <rect y="1.34" width="3" height="0.66" fill="#21468B" />
</svg>
{% elsif flag_code == 'gb' %}
<svg class="{{ flag_class }}" viewBox="0 0 60 30" role="img" aria-hidden="true" focusable="false">
  <rect width="60" height="30" fill="#012169" />
  <path d="M0 0L60 30M60 0L0 30" stroke="#FFFFFF" stroke-width="6" />
  <path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2" />
  <path d="M30 0V30M0 15H60" stroke="#FFFFFF" stroke-width="10" />
  <path d="M30 0V30M0 15H60" stroke="#C8102E" stroke-width="6" />
</svg>
{% else %}
<span class="{{ flag_class }} inline-flex items-center justify-center rounded-sm bg-stone-200 text-[10px] font-bold uppercase text-stone-700" aria-hidden="true">
  {{ include.short_label | default: flag_code }}
</span>
{% endif %}
